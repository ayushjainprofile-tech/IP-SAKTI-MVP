services:
  - type: web
    name: ip-sakti-backend
    env: python
    region: oregon # you can change this
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OLLAMA_MODEL
        value: "qwen2.5:1.5b"
      - key: AGENTIC_AI_ENABLED
        value: "false" # Set to false if Ollama can't run on the Free tier
